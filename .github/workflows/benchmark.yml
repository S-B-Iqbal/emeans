name: benchmark

# Optional, manual: reruns the in-range benchmark on a Linux runner, where the compiled
# kernels use OpenMP, and uploads the CSV as an artefact.  This complements the serial
# numbers committed in benchmarks/results/large.csv (Apple M2, no OpenMP) and gives the
# multi-threaded evidence quoted for Q-033 without shipping an OpenMP macOS wheel.

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: "Number of seeds is fixed by the runner script; this input is informational"
        required: false
        default: "5"

permissions:
  contents: read

jobs:
  large:
    name: run_suite large (ubuntu, OpenMP)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install editable (no build isolation)
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson-python meson ninja cython "numpy>=1.24" "scipy>=1.8"
          python -m pip install -e ".[test]" --no-build-isolation
      - name: Report build and machine
        run: |
          python -c "from emeans._kernels import has_openmp, max_threads; print('has_openmp', has_openmp(), 'max_threads', max_threads())"
          python -c "import os, numpy, scipy, sklearn; print('OMP_NUM_THREADS', os.environ.get('OMP_NUM_THREADS', 'unset')); print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'sklearn', sklearn.__version__)"
          nproc
      - name: Run the in-range benchmark
        run: python benchmarks/run_suite.py large
      - name: Upload the CSV
        uses: actions/upload-artifact@v4
        with:
          name: large-omp
          path: benchmarks/results/large.csv
          if-no-files-found: error
