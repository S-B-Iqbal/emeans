name: docs-publish

# Publishes the Sphinx HTML to GitHub Pages.
#
# Manual trigger only, on purpose: the deploy step needs Pages to be enabled in the repository
# settings with "GitHub Actions" as the source, which is a settings change and is therefore
# gated (rule 01).  Once the user enables it, add
#   push: { branches: [main], paths: ["docs/**", "emeans/**"] }
# to the `on:` block below (or say the word and it will be added in the next phase).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson-python meson ninja cython "numpy>=1.24" "scipy>=1.8"
          python -m pip install -e ".[test,doc]" --no-build-isolation
      - name: Build documentation (warnings are errors)
        run: python -m sphinx -W -n -b html docs docs/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
