name: docs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: sphinx (ubuntu, 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson-python meson ninja cython "numpy>=1.24" "scipy>=1.8"
          python -m pip install -e ".[test,doc]" --no-build-isolation
      - name: Build documentation (warnings are errors)
        run: python -m sphinx -W -n -b html docs docs/_build/html
