name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (ubuntu-latest, py3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Unit tests
        run: python -m pytest --pyargs emeans -q
      - name: Doctests
        run: python -m pytest --doctest-modules emeans -q
