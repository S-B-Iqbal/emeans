name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install as a wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Report OpenMP support
        working-directory: ${{ runner.temp }}
        run: python -c "from emeans._kernels import has_openmp, max_threads; print(has_openmp(), max_threads())"
      - name: Unit tests
        working-directory: ${{ runner.temp }}
        run: python -m pytest --pyargs emeans -q
      - name: Doctests
        working-directory: ${{ runner.temp }}
        run: python -m pytest --doctest-modules --pyargs emeans -q

  editable:
    name: editable install (ubuntu, 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install editable without build isolation
        run: |
          python -m pip install --upgrade pip
          python -m pip install meson-python meson ninja cython "numpy>=1.24" "scipy>=1.8"
          python -m pip install -e ".[test]" --no-build-isolation
      - run: python -m pytest --pyargs emeans -q
      - run: python -m pytest --doctest-modules emeans -q

  coverage:
    name: coverage gate (ubuntu, 3.10)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install meson-python meson ninja cython "numpy>=1.24" "scipy>=1.8"
          python -m pip install -e ".[test]" --no-build-isolation
      - run: python -m pytest --pyargs emeans -q --cov=emeans --cov-fail-under=90

  nightly-sklearn:
    name: nightly scikit-learn
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --pre --upgrade scikit-learn
          python -m pip install meson-python meson ninja cython "numpy>=1.24" "scipy>=1.8"
          python -m pip install -e ".[test]" --no-build-isolation
      - run: python -m pytest --pyargs emeans -q
